<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch Gamer</title>
</head>

<body>
<div id="overlay"></div>
<div class="center-wrapper">
    <a href="videos.html">
        <img src="start.png" alt="Clickable Image">
    </a>
</div>

<div class="logo">

   <img src="gg.png" alt="Glitch Gamer Logo">

</div>


<style>
.center-wrapper {
    display: flex;
    justify-content: center;   /* horizontal */
    align-items: center;       /* vertical */
    height: 100vh;             /* full screen height */
}

.logo {
  position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;     /* optional spacing */
      margin-top: 20px; /* adjust spacing */
}


body {
    background-image: url("background.jpg");
    background-size: cover;      /* fills the screen */
    background-repeat: no-repeat;
    background-position: center; /* keeps it centered */
    background-attachment: fixed; /* optional: parallax-style */
}

#overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    opacity: 1;
    transition: opacity 0.4s ease;
    z-index: 9999;
    pointer-events: none;
}

</style>
<script>
window.addEventListener('load', function() {
  setTimeout(function() { document.getElementById('overlay').style.opacity = '0'; }, 100);
});

document.body.addEventListener('click', function(event) {
  var link = event.target.closest('a[href]');
  if (!link) return;
  var href = link.getAttribute('href');
  if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('javascript:') || link.target === '_blank') return;
  var isLocal = href.endsWith('.html') || href.startsWith('./') || href.startsWith('../') || href.startsWith('/') || !href.includes(':');
  if (!isLocal) return;
  event.preventDefault();
  document.getElementById('overlay').style.opacity = '1';
  setTimeout(function() { window.location = href; }, 400);
});
</script>
</body>
</html>
