<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Accounts</title>
</head>
<body>
<div id="overlay"></div>

    <div class="back">
        
        <a href="index.html">
            <img src="button back.png" alt="Back Button">
        </a>
    </div>
  
    <div class="casual">
    <a href="https://github.com/spudlife25-cloud">
        <img src="git.png" alt="1">
    </a>
    </div>

    <div class="Testing">
    <a href="https://github.com/TGamesYT">
        <img src="git.png" alt="1">
    </a>
    </div>


    <div class="Studio">
    <a href="https://github.com/FunctionDevs">
        <img src="git.png" alt="1">
    </a>
    </div>


    <div class="refresh">
        <a href="githubs.html">
            <img src="button back.png">
        </a>
    </div>

    

    <style>

.Studio {
    position: fixed;
    right: calc(50% - 540px);
    top: 50%;
    transform: translateY(-50%);
}




    .casual{
    position: fixed;
    left: calc(50% - 540px);
    top: 50%;
    transform: translateY(-50%);
    }

    .Testing{
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    }

    .back {
    position: fixed;
    left: 0;
    top: 0;
    }

    .refresh {
    position: fixed;
    bottom: 0;
    right: 0;
    }

    body {
    background-image: url("tlgauntlets.png");
    background-size: cover;      /* fills the screen */
    background-repeat: no-repeat;
    background-position: center; /* keeps it centered */
    background-attachment: fixed; /* optional: parallax-style */
}

#overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    opacity: 1;
    transition: opacity 0.4s ease;
    z-index: 9999;
    pointer-events: none;
}

</style>
<script>
window.addEventListener('load', function() {
  setTimeout(function() { document.getElementById('overlay').style.opacity = '0'; }, 100);
});

document.body.addEventListener('click', function(event) {
  var link = event.target.closest('a[href]');
  if (!link) return;
  var href = link.getAttribute('href');
  if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('javascript:') || link.target === '_blank') return;
  var isLocal = href.endsWith('.html') || href.startsWith('./') || href.startsWith('../') || href.startsWith('/') || !href.includes(':');
  if (!isLocal) return;
  event.preventDefault();
  document.getElementById('overlay').style.opacity = '1';
  setTimeout(function() { window.location = href; }, 400);
});
</script>
</body>
</html>
